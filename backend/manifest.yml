name: DinoPedia

entities:
  User:
    authenticable: true
    properties:
      - name
      - name: email
        type: email
      - name: role
        type: choice
        options:
          values: [admin, user]
        default: user
    policies:
      create:
        - access: admin
      read:
        - access: restricted
          allow: User
          condition: self
      update:
        - access: restricted
          allow: User
          condition: self
      delete:
        - access: admin
      signup:
        - access: public

  Dinosaur:
    properties:
      - name: name
        type: string
      - name: description
        type: richText
      - name: period
        type: choice
        options:
          values: [Triassic, Jurassic, Cretaceous]
      - name: diet
        type: choice
        options:
          values: [Carnivore, Herbivore, Omnivore]
      - name: lengthInMeters
        type: number
      - name: image
        type: image
        options:
          sizes:
            thumbnail:
              width: 400
              height: 300
            large:
              width: 800
              height: 600
    policies:
      create:
        - access: admin
      read:
        - access: public
      update:
        - access: admin
      delete:
        - access: admin

  Sighting:
    properties:
      - name: location
        type: string
      - name: notes
        type: text
      - name: sightedAt
        type: timestamp
    belongsTo:
      - name: observer
        entity: User
      - name: dinosaur
        entity: Dinosaur
    policies:
      create:
        - access: restricted
          allow: User
      read:
        - access: restricted
          allow: User
          condition: self
      update:
        - access: restricted
          allow: User
          condition: self
      delete:
        - access: restricted
          allow: User
          condition: self


# Health check endpoint for connection testing
endpoints:
  health:
    path: /api/health
    method: GET
    policies: []
    handler: healthCheck